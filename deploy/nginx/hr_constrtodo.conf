# Эталонный server block для hr-todo-web (домен hr.constrtodo.ru).
#
# Использование на сервере:
#   sudo cp deploy/nginx/hr_constrtodo.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/hr_constrtodo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед запуском проверить пути к SSL-сертификатам в блоке `ssl_certificate*`.

# HTTP → HTTPS
server {
    listen      80;
    listen [::]:80;
    server_name hr.constrtodo.ru;

    # Разрешаем certbot-ACME challenge, всё остальное редиректим на https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr.constrtodo.ru;

    # TLS
    # Wildcard-сертификат *.constrtodo.ru (общий для проектов на этом сервере)
    ssl_certificate     /home/leonidl/certs/fullchain.pem;
    ssl_certificate_key /home/leonidl/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Отдельные логи под этот проект
    access_log /var/log/nginx/hr_constrtodo.access.log;
    error_log  /var/log/nginx/hr_constrtodo.error.log warn;

    client_max_body_size 10m;

    location / {
        # Контейнер hr-todo-web слушает HTTP на 3005 (маппинг 127.0.0.1:3005->3004/tcp).
        # SSL терминируется здесь, на nginx.
        proxy_pass http://127.0.0.1:3005;

        # Стандартный набор проксируемых заголовков
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # http1.1 нужен для keep-alive и upgrade
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;

        # httpOnly cookies (access_token/csrf_token) проходят без модификаций.
    }
}
