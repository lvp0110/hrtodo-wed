# Reference nginx server-block для hr-todo-web.
#
# Кладётся на сервер как /etc/nginx/sites-available/hr-todo-web,
# симлинк в sites-enabled. <DOMAIN> и <CERT_DIR> заменяются на реальные
# значения (либо через `sed` в bootstrap-скрипте, либо руками).
#
#   <DOMAIN>    — например, hr.example.com
#   <CERT_DIR>  — например, /etc/letsencrypt/live/hr.example.com
#
# Контейнер слушает 127.0.0.1:3005 (см. .github/workflows/deploy.yml),
# nginx терминирует TLS и проксирует всё на этот loopback.

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # ACME challenge для Let's Encrypt оставляем по HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     <CERT_DIR>/fullchain.pem;
    ssl_certificate_key <CERT_DIR>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Достаточно для аватарок / небольших аплоадов; крути под свои нужды.
    client_max_body_size 10m;

    # Один-единственный upstream: контейнер hr-todo-web на loopback.
    # Внутри него express и /api → backend (URL задаётся env API_URL).
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Куки backend'а ходят с HttpOnly, ничего дополнительно настраивать не нужно,
        # но таймауты на всякий случай поднимем — у нас есть долгие запросы.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
